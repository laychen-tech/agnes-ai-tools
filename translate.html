<div class="container">
  <div class="header">
    <h1>📖 Agnes 翻译工具</h1>
    <p>单词详解 · 句子翻译 · 由 Agnes AI 驱动</p>
  </div>

  <div class="api-bar">
    <span>🔑 API Key:</span>
    <input type="password" id="apiKey" value="sk-spL9YexY3yf1Uoe9uWEQE1yzm0WZYNIbcS2Xjh4Y4xWfZo43">
  </div>

  <div class="input-section">
    <div class="lang-selector">
      <select id="sourceLang">
        <option value="en">英语</option>
        <option value="zh">中文</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
      </select>
      <button class="swap-btn" onclick="swapLangs()" title="交换语言">⇄</button>
      <select id="targetLang">
        <option value="zh" selected>中文</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
      </select>
    </div>

    <div class="input-wrapper">
      <textarea id="inputText" placeholder="输入英文单词或句子，按 Enter 翻译，Shift+Enter 换行..."></textarea>
    </div>

    <div class="quick-label">试试这些单词：</div>
    <div class="quick-words">
      <button class="quick-word" onclick="quickTranslate('serendipity')">serendipity</button>
      <button class="quick-word" onclick="quickTranslate('ephemeral')">ephemeral</button>
      <button class="quick-word" onclick="quickTranslate('resilient')">resilient</button>
      <button class="quick-word" onclick="quickTranslate('ubiquitous')">ubiquitous</button>
      <button class="quick-word" onclick="quickTranslate('melancholy')">melancholy</button>
    </div>

    <div class="input-footer">
      <span class="char-count" id="charCount">0 字符</span>
      <button class="translate-btn" id="translateBtn" onclick="doTranslate()">翻译</button>

<script>
const BASE_URL = 'https://apihub.agnes-ai.com/v1';
const MODEL = 'agnes-2.5-flash';

const inputText = document.getElementById('inputText');
const charCount = document.getElementById('charCount');
const resultSection = document.getElementById('resultSection');
const translateBtn = document.getElementById('translateBtn');

inputText.addEventListener('input', function() {
  charCount.textContent = this.value.length + ' 字符';
});

inputText.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    doTranslate();
  }
});

function swapLangs() {
  const src = document.getElementById('sourceLang');
  const tgt = document.getElementById('targetLang');
  const tmp = src.value;
  src.value = tgt.value;
  tgt.value = tmp;
}

function quickTranslate(word) {
  inputText.value = word;
  charCount.textContent = word.length + ' 字符';
  doTranslate();
}

function getApiKey() {
  return document.getElementById('apiKey').value.trim();
}

// Detect if input is a single word (or very short phrase)
function isSingleWord(text) {
  const trimmed = text.trim();
  // No spaces, no punctuation at end, length reasonable
  const hasSpaces = /\s/.test(trimmed);
  const isShort = trimmed.split(/\s+/).length <= 2;
  return !hasSpaces || isShort;
}

async function doTranslate() {
  const text = inputText.value.trim();
  if (!text) return;

  const apiKey = getApiKey();
  if (!apiKey) { alert('请先输入 API Key'); return; }

  const srcLang = document.getElementById('sourceLang').value;
  const tgtLang = document.getElementById('targetLang').value;
  const wordMode = isSingleWord(text) && srcLang === 'en' && tgtLang === 'zh';

  translateBtn.disabled = true;
  translateBtn.textContent = '翻译中...';
  resultSection.innerHTML = `<div class="loading"><div class="spinner"></div><span>正在翻译...</span></div>`;

  try {
    let systemPrompt, userPrompt;

    if (wordMode) {
      // Word mode: detailed lookup
      systemPrompt = `你是一个专业的英汉词典。用户输入一个英文单词或短语，你需要返回详细的释义。
请严格按照以下 JSON 格式返回（不要有其他文字，只返回 JSON）：
{
  "word": "单词原形",
  "phonetic": "音标（美式）",
  "meanings": [
    {
      "pos": "词性缩写，如n. v. adj. adv. prep. conj.等",
      "meaning": "中文释义"
    }
  ],
  "examples": [
    {
      "en": "英文例句",
      "zh": "中文翻译"
    }
  ]
}
要求：
- meanings 至少 2 个词性（如果有的话）
- examples 至少 3 个例句
- 音标用美式 KK 音标
- 如果输入的是短语，也按同样格式返回`;
      userPrompt = text;
    } else {
      // Sentence mode: plain translation
      const langNames = {
        en: '英语', zh: '中文', ja: '日语', ko: '韩语',
        fr: '法语', de: '德语', es: '西班牙语'
      };
      systemPrompt = `你是一个专业翻译。请将用户输入的${langNames[srcLang]}文本翻译成${langNames[tgtLang]}。
只返回翻译结果，不要添加任何解释或多余文字。`;
      userPrompt = text;
    }

    const response = await fetch(`${BASE_URL}/chat/completions`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ],
        max_tokens: wordMode ? 800 : 500,
        temperature: 0.3
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const content = data.choices?.[0]?.message?.content || '';

    if (wordMode) {
      renderWordResult(content, text);
    } else {
      renderSentenceResult(content, text);
    }

  } catch (err) {
    resultSection.innerHTML = `<div class="error-msg">❌ 翻译失败: ${escapeHtml(err.message)}</div>`;
  } finally {
    translateBtn.disabled = false;
    translateBtn.textContent = '翻译';
  }
}

function renderWordResult(jsonText, original) {
  try {
    // Try to extract JSON from the response (in case there's extra text)
    let jsonStr = jsonText.trim();
    const jsonMatch = jsonStr.match(/\{[\s\S]*\}/);
    if (jsonMatch) jsonStr = jsonMatch[0];

    const data = JSON.parse(jsonStr);

    const posHtml = data.meanings.map(m => `
      <div class="pos-item">
        <span class="pos-label">${escapeHtml(m.pos)}</span>
        <span class="pos-meaning">${escapeHtml(m.meaning)}</span>
      </div>
    `).join('');

    const examplesHtml = data.examples && data.examples.length > 0 ? `
      <div class="examples-title">💡 例句</div>
      ${data.examples.map(ex => `
        <div class="example-item">
          <div class="example-en">${escapeHtml(ex.en)}</div>
          <div class="example-zh">${escapeHtml(ex.zh)}</div>
        </div>
      `).join('')}
    ` : '';

    resultSection.innerHTML = `
      <div class="word-result">
        <div class="word-header">
          <span class="word-title">${escapeHtml(data.word || original)}</span>
          <span class="word-phonetic">
            ${escapeHtml(data.phonetic || '')}
            <button class="speak-btn" onclick="speakWord('${escapeHtml(data.word || original)}')" title="发音">🔊</button>
          </span>
        </div>
        <div class="word-pos-list">${posHtml}</div>
        ${examplesHtml}
      </div>
    `;
  } catch (e) {
    // Fallback: just show the raw text
    resultSection.innerHTML = `
      <div class="sentence-result">
        <div class="sentence-translation">${escapeHtml(jsonText)}</div>
      </div>
    `;
  }
}

function renderSentenceResult(translation, original) {
  resultSection.innerHTML = `
    <div class="sentence-result">
      <div class="sentence-translation">${escapeHtml(translation)}</div>
      <div class="sentence-original">原文：${escapeHtml(original)}</div>
    </div>
  `;
}

function speakWord(word) {
  if (!('speechSynthesis' in window)) {
    alert('您的浏览器不支持语音合成');
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  speechSynthesis.speak(utter);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
