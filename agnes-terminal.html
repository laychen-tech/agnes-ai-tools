<script>
const BASE_URL = 'https://apihub.agnes-ai.com/v1';

// Configure marked with highlight.js
if (typeof marked !== 'undefined') {
  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: function(code, lang) {
      if (typeof hljs !== 'undefined') {
        try {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        } catch (e) { return code; }
      }
      return code;
    }
  });
}

function renderMarkdown(text) {
  if (typeof marked !== 'undefined') {
    let html = marked.parse(text);
    // Add language labels to code blocks
    html = html.replace(/<pre><code class="language-([^"]+)">/g, '<pre><code class="language-$1"><span class="lang-label">$1</span>');
    return html;
  }
  return escapeHtml(text).replace(/\n/g, '<br>');
}
let chatHistory = [];
let uploadedImages = []; // base64 data URLs
let isGenerating = false;

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// Auto-resize textarea
const chatInput = document.getElementById('chatInput');
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});

// Enter to send, Shift+Enter for newline
chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('sendBtn').addEventListener('click', sendMessage);

// Image upload for chat
document.getElementById('imageUpload').addEventListener('change', function(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    compressImage(file, 1024, 0.8).then(compressedDataUrl => {
      uploadedImages.push(compressedDataUrl);
      renderImagePreview();
    });
  });
  e.target.value = '';
});

// Compress image before upload to reduce size
function compressImage(file, maxWidth = 1024, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = (height * maxWidth) / width;
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Image URL input
document.getElementById('imgUrlBtn').addEventListener('click', function() {
  const url = prompt('输入图片 URL:');
  if (url && url.trim()) {
    uploadedImages.push(url.trim());
    renderImagePreview();
  }
});

function renderImagePreview() {
  const container = document.getElementById('imagePreview');
  container.innerHTML = '';
  uploadedImages.forEach((img, idx) => {
    const div = document.createElement('div');
    div.className = 'image-preview-item';
    div.innerHTML = `<img src="${img}" alt="preview"><div class="remove" onclick="removeImage(${idx})">×</div>`;
    container.appendChild(div);
  });
}

function removeImage(idx) {
  uploadedImages.splice(idx, 1);
  renderImagePreview();
}

function getApiKey() {
  return document.getElementById('apiKeyInput').value.trim();
}

function setStatus(type, text) {
  const el = document.getElementById('statusIndicator');
  el.innerHTML = `<span class="status-dot ${type}"></span><span style="font-size:12px;color:#888">${text}</span>`;
}

// ============ CHAT ============
async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text && uploadedImages.length === 0) return;
  if (isGenerating) return;

  const apiKey = getApiKey();
  if (!apiKey) { alert('请先输入 API Key'); return; }

  isGenerating = true;
  setStatus('thinking', '思考中...');

  // Remove welcome
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();

  // Build user message content
  let content;
  if (uploadedImages.length > 0) {
    content = [];
    // If no text, add a default prompt
    const promptText = text || '请描述一下这张图片的内容';
    content.push({ type: 'text', text: promptText });
    uploadedImages.forEach(img => {
      content.push({ type: 'image_url', image_url: { url: img } });
    });
  } else {
    content = text;
  }

  const userMsg = { role: 'user', content };
  chatHistory.push(userMsg);

  // Add user message to UI
  const displayText = text || (uploadedImages.length > 0 ? '请描述一下这张图片的内容' : '');
  addMessageToUI('user', displayText, uploadedImages);
  chatInput.value = '';
  chatInput.style.height = 'auto';
  uploadedImages = [];
  renderImagePreview();

  // Add assistant placeholder
  const assistantMsgId = addMessageToUI('assistant', '', [], true);

  try {
    const model = document.getElementById('chatModel').value;
    const messages = chatHistory.map(m => {
      if (typeof m.content === 'string' || Array.isArray(m.content)) {
        return { role: m.role, content: m.content };
      }
      return { role: m.role, content: m.content };
    });

    const response = await fetch(`${BASE_URL}/chat/completions`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model,
        messages,
        stream: true,
        max_tokens: 2048
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let reasoningText = '';
    let buffer = '';

    const contentEl = document.querySelector(`#${assistantMsgId} .message-bubble`);
    const reasoningEl = document.querySelector(`#${assistantMsgId} .reasoning-content`);
    const toggleEl = document.querySelector(`#${assistantMsgId} .reasoning-toggle`);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta;
          if (!delta) continue;

          if (delta.reasoning_content) {
            reasoningText += delta.reasoning_content;
            reasoningEl.textContent = reasoningText;
            if (reasoningText.length > 0 && toggleEl.style.display !== 'block') {
              toggleEl.style.display = 'block';
            }
          }

          if (delta.content) {
            fullText += delta.content;
            contentEl.textContent = fullText;
            const cursor = document.createElement('span');
            cursor.className = 'stream-indicator';
            contentEl.appendChild(cursor);
            scrollToBottom();
          }
        } catch (e) { /* skip parse errors */ }
      }
    }

    // Final content - render as Markdown
    if (contentEl) {
      contentEl.innerHTML = `<div class="markdown-body">${renderMarkdown(fullText)}</div>`;
      // Apply highlight to all code blocks in this message
      if (typeof hljs !== 'undefined') {
        contentEl.querySelectorAll('pre code').forEach(block => {
          hljs.highlightElement(block);
        });
      }
    }

    // Add meta
    const metaEl = document.querySelector(`#${assistantMsgId} .message-meta`);
    if (metaEl) {
      metaEl.textContent = `模型: ${model}`;
    }

    // Save to history
    chatHistory.push({ role: 'assistant', content: fullText });

    setStatus('ready', '就绪');

    // Speak the response if TTS is enabled
    if (typeof speakText === 'function') {
      speakText(fullText);
    }
  } catch (err) {
    const contentEl = document.querySelector(`#${assistantMsgId} .message-bubble`);
    if (contentEl) {
      contentEl.innerHTML = `<span style="color:#f87171">❌ 错误: ${escapeHtml(err.message)}</span>`;
    }
    chatHistory.pop(); // remove the failed user msg from history? no, keep it
    setStatus('error', '出错');
  } finally {
    isGenerating = false;
  }
}

function addMessageToUI(role, text, images = [], isStreaming = false) {
  const container = document.getElementById('chatContainer');
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${role}`;
  const id = 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
  msgDiv.id = id;

  const avatar = role === 'user' ? '🧑' : '🤖';
  let imgHtml = '';
  if (images && images.length > 0) {
    imgHtml = images.map(img => `<img src="${img}" class="message-image" alt="attached">`).join('');
  }

  let reasoningHtml = '';
  if (role === 'assistant') {
    reasoningHtml = `
      <div class="reasoning-toggle" style="display:none" onclick="this.nextElementSibling.classList.toggle('show'); this.textContent = this.nextElementSibling.classList.contains('show') ? '▼ 隐藏推理过程' : '▶ 显示推理过程'">▶ 显示推理过程</div>
      <div class="reasoning-content"></div>
    `;
  }

  const bubbleContent = isStreaming
    ? '<div class="typing-dots"><span></span><span></span><span></span></div>'
    : (role === 'user' ? escapeHtml(text) : `<div class="markdown-body">${renderMarkdown(text)}</div>`);

  msgDiv.innerHTML = `
    <div class="message-avatar">${avatar}</div>
    <div style="flex:1">
      ${reasoningHtml}
      <div class="message-bubble">${bubbleContent}${imgHtml}</div>
      <div class="message-meta"></div>
    </div>
  `;

  container.appendChild(msgDiv);
  scrollToBottom();
  return id;
}

function scrollToBottom() {
  const container = document.getElementById('chatContainer');
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function clearChat() {
  chatHistory = [];
  const container = document.getElementById('chatContainer');
  container.innerHTML = `
    <div class="welcome">
      <h2>Agnes AI 终端</h2>
      <p>支持文本对话、图片理解、图像生成、视频生成</p>
      <div style="margin-top:16px;font-size:12px;color:#666;line-height:1.8">
        💡 上传图片后提问，即可识别图片内容。例如：<br>
        "这张图里有什么？" / "描述一下这张图片" / "提取图片中的文字"
      </div>
      <div class="features">
        <div class="feature"><div class="feature-icon">💬</div><div class="feature-name">智能对话</div></div>
        <div class="feature"><div class="feature-icon">🖼️</div><div class="feature-name">图片理解</div></div>
        <div class="feature"><div class="feature-icon">🎨</div><div class="feature-name">图像生成</div></div>
        <div class="feature"><div class="feature-icon">🎬</div><div class="feature-name">视频生成</div></div>
      </div>
    </div>
  `;
}

// ============ IMAGE GENERATION ============
let imgRefImages = [];

document.getElementById('imgRefUpload').addEventListener('change', function(e) {
  const files = Array.from(e.target.files);
  imgRefImages = [];
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      imgRefImages.push(ev.target.result);
      loaded++;
    };
    reader.readAsDataURL(file);
  });
});

document.getElementById('imgGenBtn').addEventListener('click', generateImage);

async function generateImage() {
  const prompt = document.getElementById('imgPrompt').value.trim();
  if (!prompt) { alert('请输入提示词'); return; }

  const apiKey = getApiKey();
  if (!apiKey) { alert('请先输入 API Key'); return; }

  const btn = document.getElementById('imgGenBtn');
  btn.disabled = true;
  btn.textContent = '生成中...';

  const model = document.getElementById('imgModel').value;
  const ratioVal = document.getElementById('imgRatio').value;

  let size, ratio;
  if (ratioVal) {
    const [tier, r] = ratioVal.split('|');
    size = tier;
    ratio = r;
  } else {
    size = document.getElementById('imgSize').value;
  }

  const resultsDiv = document.getElementById('imgResults');

  // Add placeholder card
  const cardId = 'img-card-' + Date.now();
  const card = document.createElement('div');
  card.className = 'gen-result-card';
  card.id = cardId;
  card.innerHTML = `
    <div style="aspect-ratio:1;background:#0f0f1a;display:flex;align-items:center;justify-content:center;">
      <div class="spinner" style="width:30px;height:30px;border:3px solid #2a2a4a;border-top-color:#00d4ff;border-radius:50%;animation:spin 1s linear infinite;"></div>
    </div>
    <div class="gen-result-info"><div class="prompt-text">${escapeHtml(prompt)}</div><div>生成中...</div></div>
  `;
  resultsDiv.insertBefore(card, resultsDiv.firstChild);

  try {
    const body = {
      model,
      prompt,
      size,
      extra_body: { response_format: 'url' }
    };
    if (ratio) body.ratio = ratio;
    if (imgRefImages.length > 0) {
      body.image = imgRefImages;
    }

    const startTime = Date.now();
    const response = await fetch(`${BASE_URL}/images/generations`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || err.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

    if (data.data && data.data[0]) {
      const imgUrl = data.data[0].url;
      card.innerHTML = `
        <img src="${imgUrl}" alt="generated" loading="lazy">
        <div class="gen-result-info">
          <div class="prompt-text">${escapeHtml(prompt)}</div>
          <div>${model} · ${size}${ratio ? ' / ' + ratio : ''} · ${elapsed}s</div>
        </div>
      `;
    }
  } catch (err) {
    card.innerHTML = `
      <div style="aspect-ratio:1;background:#1a0a0a;display:flex;align-items:center;justify-content:center;color:#f87171;font-size:13px;padding:20px;text-align:center;">
        ❌ ${escapeHtml(err.message)}
      </div>
      <div class="gen-result-info"><div class="prompt-text">${escapeHtml(prompt)}</div></div>
    `;
  } finally {
    btn.disabled = false;
    btn.textContent = '生成图像';
    imgRefImages = [];
    document.getElementById('imgRefUpload').value = '';
  }
}

// ============ VIDEO GENERATION ============
document.getElementById('videoMode').addEventListener('change', function() {
  document.getElementById('keyframeInputs').style.display = this.value === 'keyframe' ? 'flex' : 'none';
  document.getElementById('refInputs').style.display = this.value === 'reference' ? 'flex' : 'none';
});

document.getElementById('videoGenBtn').addEventListener('click', generateVideo);

async function generateVideo() {
  const prompt = document.getElementById('videoPrompt').value.trim();
  if (!prompt) { alert('请输入提示词'); return; }

  const apiKey = getApiKey();
  if (!apiKey) { alert('请先输入 API Key'); return; }

  const btn = document.getElementById('videoGenBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  const mode = document.getElementById('videoMode').value;
  const seconds = document.getElementById('videoSeconds').value;
  const aspect_ratio = document.getElementById('videoRatio').value;

  const resultsDiv = document.getElementById('videoResults');
  const cardId = 'video-card-' + Date.now();
  const card = document.createElement('div');
  card.className = 'video-result-card';
  card.id = cardId;
  card.innerHTML = `
    <div class="video-status">
      <div class="spinner"></div>
      <div>视频生成中...</div>
      <div style="font-size:11px;margin-top:6px;color:#666" id="${cardId}-status">正在排队</div>
    </div>
    <div class="gen-result-info"><div class="prompt-text">${escapeHtml(prompt)}</div></div>
  `;
  resultsDiv.insertBefore(card, resultsDiv.firstChild);

  try {
    const body = {
      model: 'agnes-video-2.5-flash',
      prompt,
      seconds,
      mode,
      size: '720P',
      aspect_ratio
    };

    if (mode === 'keyframe') {
      const first = document.getElementById('firstFrame').value.trim();
      const last = document.getElementById('lastFrame').value.trim();
      if (first) body.first_frame = first;
      if (last) body.last_frame = last;
      if (!first && !last) throw new Error('关键帧模式至少需要首帧或末帧图片 URL');
    }

    if (mode === 'reference') {
      const imgs = document.getElementById('refImages').value.trim();
      if (imgs) {
        body.images = imgs.split(',').map(s => s.trim()).filter(Boolean);
      }
      if (!body.images || body.images.length === 0) {
        throw new Error('参考模式至少需要一张参考图片');
      }
    }

    const response = await fetch(`${BASE_URL}/videos`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.message || err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const videoId = data.video_id || data.id || data.task_id;

    if (!videoId) throw new Error('未获取到视频任务 ID');

    btn.textContent = '生成视频';
    btn.disabled = false;

    // Poll for result
    pollVideoResult(videoId, cardId, apiKey, prompt);

  } catch (err) {
    card.innerHTML = `
      <div style="padding:20px;text-align:center;color:#f87171;font-size:13px;">
        ❌ ${escapeHtml(err.message)}
      </div>
      <div class="gen-result-info"><div class="prompt-text">${escapeHtml(prompt)}</div></div>
    `;
    btn.textContent = '生成视频';
    btn.disabled = false;
  }
}

async function pollVideoResult(videoId, cardId, apiKey, prompt) {
  const statusEl = document.getElementById(`${cardId}-status`);
  const card = document.getElementById(cardId);
  let attempts = 0;
  const maxAttempts = 120; // 10 minutes with 5s interval

  const poll = async () => {
    attempts++;
    try {
      const response = await fetch(
        `https://apihub.agnes-ai.com/agnesapi?video_id=${encodeURIComponent(videoId)}&model_name=agnes-video-2.5-flash`,
        {
          headers: { 'Authorization': `Bearer ${apiKey}` }
        }
      );

      const data = await response.json();

      if (data.status === 'succeeded' || data.status === 'completed' || (data.data && data.data.video_url)) {
        const videoUrl = data.video_url || data.data?.video_url || data.output?.video_url;
        if (videoUrl && card) {
          card.innerHTML = `
            <video src="${videoUrl}" controls autoplay loop muted playsinline></video>
            <div class="gen-result-info"><div class="prompt-text">${escapeHtml(prompt)}</div><div>agnes-video-2.5-flash · 720P</div></div>
          `;
        }
        return;
      }

      if (data.status === 'failed' || data.error) {
        const errMsg = data.error?.message || data.statusText || '生成失败';
        if (card) {
          card.innerHTML = `
            <div style="padding:20px;text-align:center;color:#f87171;font-size:13px;">
              ❌ 生成失败: ${escapeHtml(errMsg)}
            </div>
            <div class="gen-result-info"><div class="prompt-text">${escapeHtml(prompt)}</div></div>
          `;
        }
        return;
      }

      // Still processing
      const statusText = data.status || '处理中';
      const progress = data.progress || data.data?.progress;
      if (statusEl) {
        statusEl.textContent = `${statusText}${progress ? ` (${progress}%)` : ''} · 已等待 ${attempts * 5}s`;
      }

      if (attempts >= maxAttempts) {
        if (card) {
          card.innerHTML = `
            <div style="padding:20px;text-align:center;color:#fbbf24;font-size:13px;">
              ⏱️ 超时（超过10分钟）
            </div>
            <div class="gen-result-info"><div class="prompt-text">${escapeHtml(prompt)}</div><div>video_id: ${videoId}</div></div>
          `;
        }
        return;
      }

      setTimeout(poll, 5000);
    } catch (err) {
      if (attempts < maxAttempts) {
        setTimeout(poll, 5000);
      }
    }
  };

  poll();
}

// Keyframe CSS for spinner
const style = document.createElement('style');
style.textContent = `
  @keyframes spin { to { transform: rotate(360deg); } }
`;
document.head.appendChild(style);

// ============ VOICE / SPEECH ============
let ttsEnabled = false;
let recognition = null;
let isListening = false;
let selectedVoice = null;

// Init TTS voices
function initVoices() {
  const voiceSelect = document.getElementById('voiceSelect');
  const voices = speechSynthesis.getVoices();
  const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
  const otherVoices = voices.filter(v => !v.lang.startsWith('zh'));
  const allVoices = [...zhVoices, ...otherVoices];

  voiceSelect.innerHTML = '';
  allVoices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(opt);
  });

  if (zhVoices.length > 0) {
    selectedVoice = zhVoices[0];
    voiceSelect.value = zhVoices[0].name;
  } else if (allVoices.length > 0) {
    selectedVoice = allVoices[0];
  }
}

if ('speechSynthesis' in window) {
  initVoices();
  speechSynthesis.onvoiceschanged = initVoices;
}

// TTS toggle
document.getElementById('ttsBtn').addEventListener('click', function() {
  if (!('speechSynthesis' in window)) {
    alert('您的浏览器不支持语音合成');
    return;
  }
  ttsEnabled = !ttsEnabled;
  this.textContent = ttsEnabled ? '🔊 语音回答: 开' : '🔊 语音回答: 关';
  this.style.color = ttsEnabled ? '#4ade80' : '';
  this.style.borderColor = ttsEnabled ? '#4ade80' : '';
  document.getElementById('voiceSelect').style.display = ttsEnabled ? 'inline-flex' : 'none';
});

document.getElementById('voiceSelect').addEventListener('change', function() {
  const voices = speechSynthesis.getVoices();
  selectedVoice = voices.find(v => v.name === this.value) || null;
});

function speakText(text) {
  if (!ttsEnabled || !('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = 1.0;
  utter.pitch = 1.0;
  if (selectedVoice) utter.voice = selectedVoice;
  speechSynthesis.speak(utter);
}

// Speech recognition (voice input)
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

document.getElementById('voiceBtn').addEventListener('click', function() {
  if (!SpeechRecognition) {
    alert('您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器');
    return;
  }

  if (isListening) {
    stopListening();
    return;
  }
  startListening();
});

function startListening() {
  if (!SpeechRecognition) return;

  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;

  const btn = document.getElementById('voiceBtn');
  let finalTranscript = '';

  recognition.onstart = function() {
    isListening = true;
    btn.textContent = '🔴 正在聆听...';
    btn.style.color = '#f87171';
    btn.style.borderColor = '#f87171';
    chatInput.placeholder = '正在聆听，请说话...';
  };

  recognition.onresult = function(event) {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += transcript;
      } else {
        interim += transcript;
      }
    }
    chatInput.value = finalTranscript + interim;
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 200) + 'px';
  };

  recognition.onerror = function(event) {
    console.error('语音识别错误:', event.error);
    stopListening();
    if (event.error === 'not-allowed') {
      alert('麦克风权限被拒绝，请允许浏览器访问麦克风');
    }
  };

  recognition.onend = function() {
    stopListening();
    // If we got some text, auto-send after a short delay
    if (finalTranscript.trim()) {
      chatInput.value = finalTranscript.trim();
      setTimeout(() => sendMessage(), 300);
    }
  };

  recognition.start();
}

function stopListening() {
  isListening = false;
  const btn = document.getElementById('voiceBtn');
  btn.textContent = '🎤 语音输入';
  btn.style.color = '';
  btn.style.borderColor = '';
  chatInput.placeholder = '输入消息... 上传图片后可以提问关于图片的问题 (Shift+Enter 换行，Enter 发送)';
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }
}
